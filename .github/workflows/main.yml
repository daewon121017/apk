name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake \
            build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==3.0.11 virtualenv

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Error summary (only when failed)
        if: failure()
        run: |
          echo "===== ERROR LINES ====="
          grep -n -i -E "error|failed|exception|not found|no such|traceback|command failed" build.log | grep -v -E "^[0-9]+:#\s+[A-Za-z_0-9]+ = " | tail -n 40 || true
          echo "===== LAST LINES (env removed) ====="
          grep -v -E "^#\s+[A-Za-z_0-9]+ = " build.log | tail -n 40 || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: bin/*.apk
